[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-brand-kit-generator"
version = "0.4.2"
description = "AI-driven brand kit generator for Windows desktop — logos, palettes, type, voice, exports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-brand-kit-generator maintainers" }]
keywords = ["branding", "design", "ai", "generator", "windows", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Designers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pillow>=10.3",
  "fonttools>=4.53",
  "httpx>=0.27",
  "numpy>=1.26",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.18"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[project.scripts]
brandkit = "ai_brand_kit.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourorg/ai-brand-kit-generator"
Issues = "https://github.com/yourorg/ai-brand-kit-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["ai_brand_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ai_brand_kit/core", "ai_brand_kit/generators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"